# Deploy Staging — обновление staging-окружения на сервере.
#
# Триггер: repository_dispatch от build.yml (после успешной сборки образов в main).
# Также можно запустить вручную.
#
# Требуемые GitHub Secrets:
#   SSH_HOST    — IP или hostname сервера
#   SSH_USER    — пользователь для SSH (например, deploy)
#   SSH_KEY     — приватный SSH-ключ
#   GHCR_PAT    — Personal Access Token с правом read:packages (если репо приватный)

name: Deploy Staging

on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (например, sha-abc1234 или latest)'
        required: true
        default: 'latest'

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest

    steps:
      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE_TAG,GHCR_OWNER,GHCR_PAT,GITHUB_ACTOR
          script: |
            set -e
            cd /opt/vibely-staging

            if [ -n "$GHCR_PAT" ]; then
              echo "$GHCR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            fi

            export IMAGE_TAG="$IMAGE_TAG"
            export GHCR_OWNER="$GHCR_OWNER"

            echo "Pulling images with tag: $IMAGE_TAG"
            docker compose -f docker-compose.deploy.yml --env-file .env.staging pull

            echo "Restarting services..."
            docker compose -f docker-compose.deploy.yml --env-file .env.staging up -d --remove-orphans

            docker image prune -af --filter "until=24h"

            echo "Staging deployed successfully"
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            sleep 10
            if curl -fsS -o /dev/null -w "%{http_code}" "https://${{ vars.STAGING_DOMAIN || secrets.SSH_HOST }}:3100/" | grep -qE "^(200|301|302)$"; then
              echo "Staging is up"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
          done
          echo "Staging not responding after deploy"
          exit 1
